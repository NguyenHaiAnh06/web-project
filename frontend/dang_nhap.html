          <div class="form-group">
            <input
              type="text"
              name="username"
              placeholder="Email hoặc Tên đăng nhập"

            <input
              type="password"
              name="password"
              placeholder="Mật khẩu"

            />

          <button type="submit" class="btn">Đăng nhập</button>

          <div class="auth-links">
            <a href="#" class="forgot">Quên mật khẩu?</a>
