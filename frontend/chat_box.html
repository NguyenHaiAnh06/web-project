<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chat với shop</title>
  </head>

  <body>
    <a href="giao_dien.html">HOME</a>
    <div class="chat">
      <div class="chat-header">
        <span class="chat-title">Hỗ trợ khách hàng</span>
      </div>

      <div class="chat-body">
        <div class="chat-message chat-message-shop">
          <span class="chat-text">Shop Quý Ông chào quý khách👋.</span>
        </div>

        <div class="chat-message chat-message-user">
          <span class="chat-text">Tôi cần tư vấn sản phẩm.</span>
        </div>
      </div>

      <div class="chat-message chat-message-shop">
        <span class="chat-text">Tôi cần hủy đơn hàng.</span>
      </div>

      <div class="chat-message chat-message-shop">
        <span class="chat-text">Tôi gặp sự cố.</span>
      </div>

      <div class="chat-message chat-message-shop">
        <span class="chat-text"
          >Tôi cần được cô giáo:Lê Trang cho 10 điểm.</span
        >
      </div>

      <form
        class="chat-input"
        action="backend thêm để liên hệ nhá"
        method="post"
      >
        <input
          type="text"
          name="message"
          class="chat-input-text"
          placeholder="Nhập câu hỏi..."
        />

        <button type="submit" class="chat-input-send">Gửi</button>
        <!-- Nút Zalo / Chat -->
        <div class="chat-float">
          <img
            src="https://static-omni.worldfone.cloud/uploads/omni_chat/2024/04/12/images/10079_1712912724woni.jpg"
            alt="Zalo Chat"
          />
        </div>
      </form>
    </div>
  </body>
</html>
